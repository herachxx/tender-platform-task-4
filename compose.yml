services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tender_lab
      POSTGRES_USER: tender_app
      POSTGRES_PASSWORD: local-dev-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_app -d tender_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: